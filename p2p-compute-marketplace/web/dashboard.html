<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>KINETIC | Dashboard</title>
    <meta name="description" content="Your jobs, spending, and compute proofs."/>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background: #0b0d10; color: #e8edf5; margin: 0; }
        h1,h2,h3,h4 { font-family: 'Space Grotesk', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .glass { background: rgba(18,22,28,0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.06); }
        .card-hover { transition: transform 0.2s, box-shadow 0.2s; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,245,255,0.08); }
        .tab-btn { padding: 0.75rem 1.25rem; font-weight: 600; border-bottom: 2px solid transparent; transition: all 0.2s; color: #94a3b8; font-size: 0.875rem; cursor: pointer; background: none; }
        .tab-btn.active { color: #22d3ee; border-bottom-color: #22d3ee; }
        .tab-btn:hover { color: #e2e8f0; }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        .badge { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.7rem; font-weight: 600; }
        .badge-completed { background: rgba(16,185,129,0.12); color: #34d399; border: 1px solid rgba(16,185,129,0.25); }
        .badge-failed { background: rgba(239,68,68,0.12); color: #f87171; border: 1px solid rgba(239,68,68,0.25); }
        .badge-pending { background: rgba(245,158,11,0.12); color: #fbbf24; border: 1px solid rgba(245,158,11,0.25); }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeInUp 0.4s ease-out forwards; }
    </style>
</head>
<body>

<div id="nav"></div>

<main class="max-w-7xl mx-auto px-6 py-8">
    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-8">
        <div>
            <h1 class="text-3xl font-bold tracking-tight">Dashboard</h1>
            <p class="text-slate-500 text-sm mt-1">Your jobs, spending, and proofs</p>
        </div>
        <div class="flex items-center gap-3">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span class="text-xs font-mono uppercase tracking-widest text-slate-500" id="lastUpdate">Live</span>
            <button id="refreshBtn" class="glass px-3 py-2 rounded-lg text-cyan-400 text-xs font-bold hover:bg-white/5 transition-all flex items-center gap-1.5">
                <span class="material-symbols-outlined text-sm">refresh</span>
                Refresh
            </button>
        </div>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
        <div class="glass rounded-xl p-5 animate-in" style="animation-delay:0ms">
            <p class="text-[10px] font-mono uppercase tracking-widest text-slate-500 mb-1">Total Jobs</p>
            <p class="text-2xl font-bold text-cyan-400" id="statTotalJobs">—</p>
        </div>
        <div class="glass rounded-xl p-5 animate-in" style="animation-delay:50ms">
            <p class="text-[10px] font-mono uppercase tracking-widest text-slate-500 mb-1">Completed</p>
            <p class="text-2xl font-bold text-emerald-400" id="statCompleted">—</p>
        </div>
        <div class="glass rounded-xl p-5 animate-in" style="animation-delay:100ms">
            <p class="text-[10px] font-mono uppercase tracking-widest text-slate-500 mb-1">ALGO Spent</p>
            <p class="text-2xl font-bold text-violet-400" id="statAlgo">—</p>
        </div>
        <div class="glass rounded-xl p-5 animate-in" style="animation-delay:150ms">
            <p class="text-[10px] font-mono uppercase tracking-widest text-slate-500 mb-1">Success Rate</p>
            <p class="text-2xl font-bold text-amber-400" id="statSuccess">—</p>
        </div>
    </div>

    <!-- Tabs -->
    <div class="glass rounded-xl border border-white/5 overflow-hidden">
        <div class="flex border-b border-white/5 px-4">
            <button class="tab-btn active" data-tab="jobs">
                <span class="material-symbols-outlined text-sm mr-1 align-middle">work_history</span>Jobs
            </button>
            <button class="tab-btn" data-tab="proofs">
                <span class="material-symbols-outlined text-sm mr-1 align-middle">verified</span>Proofs
            </button>
            <button class="tab-btn" data-tab="network">
                <span class="material-symbols-outlined text-sm mr-1 align-middle">hub</span>Network
            </button>
        </div>

        <!-- Jobs Tab -->
        <div class="tab-panel active p-4" id="panel-jobs">
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="text-[10px] font-mono uppercase tracking-widest text-slate-500 border-b border-white/5">
                            <th class="text-left px-4 py-3">Job ID</th>
                            <th class="text-left px-4 py-3">Type</th>
                            <th class="text-left px-4 py-3">Tokens</th>
                            <th class="text-left px-4 py-3">Duration</th>
                            <th class="text-left px-4 py-3">Status</th>
                            <th class="text-left px-4 py-3">Hash</th>
                        </tr>
                    </thead>
                    <tbody id="jobsTable">
                        <tr><td colspan="6" class="text-center py-12 text-slate-500">Loading jobs...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Proofs Tab -->
        <div class="tab-panel p-4" id="panel-proofs">
            <div id="proofsContent">
                <p class="text-center py-8 text-slate-500">Loading proofs...</p>
            </div>
        </div>

        <!-- Network Tab -->
        <div class="tab-panel p-4" id="panel-network">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                <div class="glass rounded-xl p-4 text-center">
                    <p class="text-[10px] font-mono uppercase tracking-widest text-slate-500 mb-1">Providers</p>
                    <p class="text-2xl font-bold text-cyan-400" id="netProviders">—</p>
                </div>
                <div class="glass rounded-xl p-4 text-center">
                    <p class="text-[10px] font-mono uppercase tracking-widest text-slate-500 mb-1">GPUs</p>
                    <p class="text-2xl font-bold text-emerald-400" id="netGPUs">—</p>
                </div>
                <div class="glass rounded-xl p-4 text-center">
                    <p class="text-[10px] font-mono uppercase tracking-widest text-slate-500 mb-1">Total VRAM</p>
                    <p class="text-2xl font-bold text-violet-400" id="netVRAM">—</p>
                </div>
                <div class="glass rounded-xl p-4 text-center">
                    <p class="text-[10px] font-mono uppercase tracking-widest text-slate-500 mb-1">Avg Uptime</p>
                    <p class="text-2xl font-bold text-amber-400" id="netUptime">—</p>
                </div>
            </div>
            <div id="providerList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>
    </div>
</main>

<div id="footer"></div>

<script type="module">
import { renderNav, renderFooter, fetchJson, toast } from '/static/js/shared.js';
import '/static/js/wallet-init.js';

document.getElementById('nav').innerHTML = renderNav('dashboard');
document.getElementById('footer').innerHTML = renderFooter();

// Tabs
document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
});

async function loadAnalytics() {
    try {
        const data = await fetchJson('/analytics');
        document.getElementById('statTotalJobs').textContent = data.total_jobs || 0;
        document.getElementById('statCompleted').textContent = data.completed_jobs || 0;
        document.getElementById('statAlgo').textContent = (data.total_algo_spent || 0).toFixed(2) + ' A';
        document.getElementById('statSuccess').textContent = (data.success_rate || 0) + '%';
    } catch (e) { console.log('Analytics error:', e); }
}

async function loadJobs() {
    try {
        const jobs = await fetchJson('/jobs?limit=50');
        const tbody = document.getElementById('jobsTable');
        if (!jobs || jobs.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center py-12 text-slate-500">No jobs yet. Deploy a job from Explore.</td></tr>';
            return;
        }
        tbody.innerHTML = jobs.map(job => {
            const statusClass = job.status === 'completed' ? 'badge-completed' : job.status === 'failed' ? 'badge-failed' : 'badge-pending';
            const hash = job.result_hash ? job.result_hash.substring(0, 14) + '...' : '—';
            return `<tr class="border-b border-white/5 hover:bg-white/[0.02] transition-colors">
                <td class="px-4 py-3 font-mono text-xs text-cyan-400">${(job.job_id || '').substring(0, 12)}...</td>
                <td class="px-4 py-3">${job.task_type || 'compute'}</td>
                <td class="px-4 py-3 font-mono">${job.tokens || 0}</td>
                <td class="px-4 py-3 font-mono">${job.duration_ms || 0}ms</td>
                <td class="px-4 py-3"><span class="badge ${statusClass}">${job.status || 'pending'}</span></td>
                <td class="px-4 py-3 font-mono text-xs text-slate-400">${hash}</td>
            </tr>`;
        }).join('');
    } catch (e) { console.log('Jobs error:', e); }
}

async function loadProofs() {
    try {
        const jobs = await fetchJson('/jobs?limit=50');
        const container = document.getElementById('proofsContent');
        const completed = (jobs || []).filter(j => j.status === 'completed' && j.result_hash);
        if (completed.length === 0) {
            container.innerHTML = '<p class="text-center py-8 text-slate-500">No proofs yet. Completed jobs generate cryptographic proofs.</p>';
            return;
        }
        container.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            ${completed.map(job => `
                <div class="glass rounded-xl p-4 card-hover">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="material-symbols-outlined text-emerald-400 text-sm">verified</span>
                        <span class="text-[10px] font-mono uppercase tracking-widest text-emerald-400">Proof</span>
                    </div>
                    <p class="font-mono text-xs text-slate-300 break-all mb-2">${job.result_hash}</p>
                    <div class="flex justify-between text-[10px] text-slate-500">
                        <span>${job.task_type || 'compute'}</span>
                        <span>${job.tokens || 0} tokens</span>
                    </div>
                </div>
            `).join('')}
        </div>`;
    } catch (e) { console.log('Proofs error:', e); }
}

async function loadNetwork() {
    try {
        const [stats, providers] = await Promise.all([
            fetchJson('/network/stats').catch(() => null),
            fetchJson('/providers').catch(() => []),
        ]);
        if (stats) {
            document.getElementById('netProviders').textContent = stats.total_providers || 0;
            document.getElementById('netGPUs').textContent = stats.total_gpus || 0;
            document.getElementById('netVRAM').textContent = (stats.total_vram_gb || 0) + ' GB';
            document.getElementById('netUptime').textContent = (stats.network_uptime || 0) + '%';
        }
        const list = document.getElementById('providerList');
        const arr = Array.isArray(providers) ? providers : [];
        if (arr.length === 0) {
            list.innerHTML = '<p class="text-slate-500 text-sm">No providers online.</p>';
            return;
        }
        list.innerHTML = arr.map(p => `
            <div class="glass rounded-xl p-4 flex items-center justify-between">
                <div>
                    <h3 class="font-bold text-sm">${p.name || p.id}</h3>
                    <p class="text-xs text-slate-500">${p.gpu_model || 'GPU'} &middot; ${p.vram_gb || '?'}GB</p>
                </div>
                <div class="text-right">
                    <p class="text-xs font-mono text-cyan-400">${typeof p.price_per_hour === 'number' ? p.price_per_hour.toFixed(2) : p.price_per_hour} A/hr</p>
                    <p class="text-[10px] text-slate-500">${p.uptime || '—'}% uptime</p>
                </div>
            </div>
        `).join('');
    } catch (e) { console.log('Network error:', e); }
}

async function loadAll() {
    document.getElementById('lastUpdate').textContent = 'Updating...';
    await Promise.all([loadAnalytics(), loadJobs(), loadProofs(), loadNetwork()]);
    document.getElementById('lastUpdate').textContent = 'Updated ' + new Date().toLocaleTimeString();
}

document.getElementById('refreshBtn').addEventListener('click', loadAll);
loadAll();
setInterval(loadAll, 30000);
</script>
</body>
</html>

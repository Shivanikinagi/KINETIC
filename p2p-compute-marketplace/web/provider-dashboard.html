<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provider Dashboard - Kinetic</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .stat-card h3 {
            color: #666;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .stat-card .value {
            color: #333;
            font-size: 32px;
            font-weight: 700;
        }

        .stat-card .label {
            color: #999;
            font-size: 12px;
            margin-top: 5px;
        }

        .providers-section {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .providers-section h2 {
            color: #333;
            font-size: 22px;
            margin-bottom: 20px;
        }

        .provider-card {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .provider-card:hover {
            border-color: #667eea;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
        }

        .provider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .provider-name {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-active {
            background: #d4edda;
            color: #155724;
        }

        .status-inactive {
            background: #f8d7da;
            color: #721c24;
        }

        .provider-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            color: #666;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .detail-value {
            color: #333;
            font-size: 14px;
            font-weight: 500;
        }

        .provider-actions {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #dee2e6;
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-toggle {
            background: #667eea;
            color: white;
        }

        .btn-toggle:hover {
            background: #5568d3;
        }

        .btn-view {
            background: #e9ecef;
            color: #333;
        }

        .btn-view:hover {
            background: #dee2e6;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 14px;
            color: #999;
        }

        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #667eea;
            color: white;
            border: none;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.6);
        }

        .refresh-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Provider Dashboard</h1>
            <p>Manage your compute providers on Algorand TestNet</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Providers</h3>
                <div class="value" id="total-providers">-</div>
                <div class="label">Registered on-chain</div>
            </div>
            <div class="stat-card">
                <h3>Active Providers</h3>
                <div class="value" id="active-providers">-</div>
                <div class="label">Currently accepting jobs</div>
            </div>
            <div class="stat-card">
                <h3>Total VRAM</h3>
                <div class="value" id="total-vram">-</div>
                <div class="label">GB available</div>
            </div>
            <div class="stat-card">
                <h3>Avg Uptime</h3>
                <div class="value" id="avg-uptime">-</div>
                <div class="label">Across all providers</div>
            </div>
        </div>

        <div class="providers-section">
            <h2>Registered Providers</h2>
            <div id="providers-list">
                <div class="loading">Loading providers...</div>
            </div>
        </div>
    </div>

    <button class="refresh-btn" onclick="loadProviders()" title="Refresh">↻</button>

    <script>
        async function loadProviders() {
            const listEl = document.getElementById('providers-list');
            listEl.innerHTML = '<div class="loading">Loading providers...</div>';

            try {
                const response = await fetch('/providers');
                const providers = await response.json();

                if (providers.length === 0) {
                    listEl.innerHTML = `
                        <div class="empty-state">
                            <h3>No Providers Found</h3>
                            <p>Register your first provider to get started</p>
                        </div>
                    `;
                    updateStats(providers);
                    return;
                }

                // Render providers
                listEl.innerHTML = providers.map(provider => `
                    <div class="provider-card">
                        <div class="provider-header">
                            <div class="provider-name">${provider.name || provider.org_name || 'Unknown Provider'}</div>
                            <span class="status-badge ${provider.status === 'active' ? 'status-active' : 'status-inactive'}">
                                ${provider.status === 'active' ? 'Active' : 'Inactive'}
                            </span>
                        </div>
                        <div class="provider-details">
                            <div class="detail-item">
                                <div class="detail-label">GPU Model</div>
                                <div class="detail-value">${provider.gpu_model || 'N/A'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">VRAM</div>
                                <div class="detail-value">${provider.vram_gb || 0} GB</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Price</div>
                                <div class="detail-value">${provider.price_per_hour ? provider.price_per_hour.toFixed(2) : '0.00'} ALGO/hr</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Uptime</div>
                                <div class="detail-value">${provider.uptime ? provider.uptime.toFixed(2) : '0.00'}%</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Payment Address</div>
                                <div class="detail-value" style="font-size: 11px; word-break: break-all;">
                                    ${provider.payment_address ? provider.payment_address.substring(0, 12) + '...' : 'N/A'}
                                </div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Verified</div>
                                <div class="detail-value">${provider.verified_member ? '✓ Yes' : '✗ No'}</div>
                            </div>
                        </div>
                        <div class="provider-actions">
                            <button class="btn btn-toggle" onclick="toggleProvider('${provider.payment_address}', '${provider.status}')">
                                ${provider.status === 'active' ? 'Deactivate' : 'Activate'}
                            </button>
                            <button class="btn btn-view" onclick="viewOnExplorer('${provider.payment_address}')">
                                View on AlgoExplorer
                            </button>
                        </div>
                    </div>
                `).join('');

                updateStats(providers);
            } catch (error) {
                console.error('Error loading providers:', error);
                listEl.innerHTML = `
                    <div class="empty-state">
                        <h3>Error Loading Providers</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        function updateStats(providers) {
            const total = providers.length;
            const active = providers.filter(p => p.status === 'active').length;
            const totalVram = providers.reduce((sum, p) => sum + (p.vram_gb || 0), 0);
            const avgUptime = total > 0 
                ? (providers.reduce((sum, p) => sum + (p.uptime || 0), 0) / total).toFixed(2)
                : '0.00';

            document.getElementById('total-providers').textContent = total;
            document.getElementById('active-providers').textContent = active;
            document.getElementById('total-vram').textContent = totalVram;
            document.getElementById('avg-uptime').textContent = avgUptime + '%';
        }

        function toggleProvider(address, currentStatus) {
            alert(`Toggle provider ${address} (currently ${currentStatus})\n\nThis would call the deregister_provider() method on the smart contract.`);
        }

        function viewOnExplorer(address) {
            window.open(`https://testnet.algoexplorer.io/address/${address}`, '_blank');
        }

        // Load providers on page load
        loadProviders();

        // Auto-refresh every 30 seconds
        setInterval(loadProviders, 30000);
    </script>
</body>
</html>
